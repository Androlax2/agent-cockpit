[advisories]
yanked = "deny"

[licenses]
# Additions need review; this covers the active graph, not unused optional packages.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Only unpublished workspace crates; this does not assign them a license.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Unpublished internal path dependencies inherit the workspace version (#120).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
