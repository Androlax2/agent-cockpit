name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through SECURITY.md, not here.
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The command or action, and what Cockpit did. Paste output as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Linux distribution, macOS version, or WSL2 with its distribution.
    validations:
      required: true
