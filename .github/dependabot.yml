# Version updates, decided by Theo for #382: monthly, one grouped pull request per ecosystem,
# at most two open. Security updates are a repository setting and stay on independently.
# Only the root workspace: apps/ is the old cockpit, removed at the cutover (#66).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ['*']
