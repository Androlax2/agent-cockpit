name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  # The languages to scan (tools/codeql-languages.py): a pull request scans Rust only when it
  # touches Rust, so a docs-only change waits on no Rust scan. `actions` is always scanned: the
  # CodeQL merge protection ruleset needs CodeQL results on every pull request (#1261).
  languages:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      ((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.select.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the languages this change needs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...HEAD" | python3 tools/codeql-languages.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/codeql-languages.py --all >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: languages
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      ((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: matrix.language == 'rust'
        with:
          toolchain: 1.99.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # A pull request that touches no Rust has no Rust scan, but the CodeQL merge protection ruleset
  # still waits for a `/language:rust` configuration on its head commit. That change cannot alter
  # Rust results, so it carries main's latest Rust analysis instead of the slow scan (#1300).
  reuse-rust:
    needs: languages
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON(needs.languages.outputs.languages), 'rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Fetch main's latest Rust analysis
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          analysis_id=$(gh api "repos/$REPOSITORY/code-scanning/analyses?ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
            --jq 'first(.[] | select(.category == "/language:rust" and .error == "")) | .id')
          if [ -z "$analysis_id" ]; then
            echo "::error::No /language:rust CodeQL analysis exists on main. Re-run the latest CodeQL run on main (Actions tab) so a Rust scan exists, then re-run this job."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/main-rust"
          gh api -H "Accept: application/sarif+json" "repos/$REPOSITORY/code-scanning/analyses/$analysis_id" \
            > "$RUNNER_TEMP/main-rust/rust.sarif"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/main-rust/rust.sarif
          category: /language:rust
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          sha: ${{ github.event.pull_request.head.sha }}
