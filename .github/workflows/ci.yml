name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs this change needs (tools/ci-jobs.py); a push to main runs every job once.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      greenfield: ${{ steps.select.outputs.greenfield }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the jobs this change needs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...HEAD" | python3 tools/ci-jobs.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci-jobs.py --all >> "$GITHUB_OUTPUT"
          fi

  # The root workspace in crates/.
  greenfield:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2,typos@1.51.1
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        # Disposable hosted runners have no workstation game-guard daemon.
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Run the greenfield gate
        run: make greenfield-ci

  # The daemon's startup tests on macOS, clean-home start included (M0 gate, #27); the full
  # greenfield gate stays on Linux. Plain cargo: the Makefile's agent-build runner is Linux-only.
  greenfield-macos:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      - name: Start the daemon on a clean home
        run: cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-daemon --test startup
      # The process supervisor's macOS paths: ps start tokens, the boot session id and
      # process-group containment.
      - name: Supervise processes
        run: cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-processes

  # The daemon's startup tests inside WSL 2 on Windows: the M0 gate's WSL2 proof (#27), since
  # no Windows machine is available for a hand run. Tests run from a copy in the
  # distribution's own file system, where modes are Linux modes, not DrvFs ones.
  greenfield-wsl2:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep LF line endings in the checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: build-essential ca-certificates curl
      - name: Refuse to run anywhere but WSL 2
        run: |
          set -euo pipefail
          uname -r
          case "$(uname -r)" in *microsoft-standard-WSL2*) ;; *) exit 1 ;; esac
      - name: Install Rust 1.99.1 and cargo-nextest 0.9.150
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/0.9.150/linux \
            | tar zxf - -C "$HOME/.cargo/bin"
      - name: Copy the checkout into the distribution's file system
        run: |
          set -euo pipefail
          test -f Cargo.toml
          cp -a . "$HOME/agent-cockpit"
      - name: Start the daemon on a clean home
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cd "$HOME/agent-cockpit"
          cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-daemon --test startup

  # Markdown and spelling, for docs/ and any Markdown file.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.0
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: typos@1.51.1
      - name: Install the pinned Markdown and link checkers
        run: |
          npm install --global markdownlint-cli2@0.24.0
          cargo install --locked --version 0.24.2 lychee
      - name: Run the docs gate
        run: make docs-ci
