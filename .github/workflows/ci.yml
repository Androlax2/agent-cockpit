name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs this change needs (tools/ci-jobs.py); a push to main runs every job once.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      greenfield: ${{ steps.select.outputs.greenfield }}
      platform: ${{ steps.select.outputs.platform }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the jobs this change needs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...HEAD" | python3 tools/ci-jobs.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci-jobs.py --all >> "$GITHUB_OUTPUT"
          fi

  # The root workspace in crates/: the checks that run no test (fmt, clippy, doc, deny, typos).
  # The tests run in greenfield-test's shards; the required check is greenfield, below (#997).
  greenfield-lint:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: cargo-deny@0.20.2,typos@1.51.1
      # Reviewed pin (#397): main saves, pull requests restore; docs/decisions/2026-11-01-397-ci-cost.md.
      # Its own entry, keyed by this job's id: clippy and rustdoc build other artifacts than the tests.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        # Disposable hosted runners have no workstation game-guard daemon.
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Run the greenfield gate's checks that run no test
        run: make greenfield-lint

  # The workspace's tests are built once, here, into a nextest archive that the test shards and
  # the sandbox job unpack (#1261; docs/decisions/2026-11-09-1261-one-test-build.md). The plan
  # step cuts the archive's test binaries into shards by their measured time
  # (tools/ci-shards.py, tools/ci-test-weights.json).
  greenfield-build:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      # Reviewed pin (#397): main saves, pull requests restore; docs/decisions/2026-11-01-397-ci-cost.md.
      # `shared-key: greenfield` is the key the single greenfield job saved before #997; the
      # shards restore it for the registry their cargo-running tests read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: greenfield
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        # Disposable hosted runners have no workstation game-guard daemon.
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Build the workspace's tests and programs once, into one archive
        run: make crates-test-archive
      - name: Cut the archive's test binaries into shards by measured time
        id: plan
        run: |
          set -euo pipefail
          cargo nextest list --locked --cargo-quiet --manifest-path Cargo.toml --workspace \
            --message-format json | python3 tools/ci-shards.py plan >> "$GITHUB_OUTPUT"
      # Already zstd-compressed: zipping it again only costs time.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: greenfield-tests
          path: greenfield-tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # The workspace's tests, one shard of the archive per matrix entry: every test binary runs in
  # exactly one shard, because the plan cut the shards from the archive's own list.
  greenfield-test:
    needs: [changes, greenfield-build]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.greenfield-build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      # Reviewed pin (#397). Some tests run `cargo metadata` and need the registry; the build
      # job saves the entry on main, so a shard only restores it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: greenfield
          save-if: false
          cache-bin: false
      - name: Install tmux and bubblewrap for the real tmux server and sandbox tests
        # Ubuntu's AppArmor refuses unprivileged user namespaces by default; the native sandbox
        # (#829) needs one, as on the hosts it supports.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux bubblewrap
          tmux -V
          bwrap --version
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: greenfield-tests
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        # Disposable hosted runners have no workstation game-guard daemon.
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Run this shard of the greenfield workspace's tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: make crates-test-from-archive TEST_FILTER="$TEST_FILTER"
      # The seconds each test binary took: tools/ci-shards.py weights turns them into
      # tools/ci-test-weights.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # The sandbox steps that need the whole build but none of the tests: a second Unix user, and
  # the live probe. A job beside the shards, so neither lengthens a shard (#997); it unpacks the
  # shards' archive (#1261).
  greenfield-sandbox:
    needs: [changes, greenfield-build]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      - name: Install tmux and bubblewrap for the real tmux server and sandbox tests
        # Ubuntu's AppArmor refuses unprivileged user namespaces by default; the native sandbox
        # (#829) needs one, as on the hosts it supports.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux bubblewrap
          tmux -V
          bwrap --version
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: greenfield-tests
      - name: Unpack the workspace's tests and programs, as a test shard does
        run: >-
          cargo nextest list --archive-file greenfield-tests.tar.zst
          --extract-to . --extract-overwrite --workspace-remap "$PWD"
          --message-format json > "$RUNNER_TEMP/test-list.json"
      - name: "Run the daemon's sandbox tests, with the ignored one for #628, as a second Unix user"
        # The test shards ran sandboxed sessions as the runner's user; a sandbox that keeps state
        # at a fixed shared path then fails for anyone else (#628). The second user runs this
        # job's unpacked build, the shards' own, copied to a root-owned folder it can read. sudo
        # stays in this disposable runner.
        run: |
          set -euo pipefail
          sudo useradd --create-home torlek-second
          test_binary=$(jq -er '."rust-suites"["cockpit-daemon::sandbox"]."binary-path"' "$RUNNER_TEMP/test-list.json")
          programs=$(dirname "$(dirname "$test_binary")")
          root=/opt/torlek-second-user
          sudo install -d -m 0755 "$root/bin"
          for program in $(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name'); do
            sudo install -m 0755 "$programs/$program" "$root/bin/"
          done
          sudo install -m 0755 "$test_binary" "$root/sandbox-test"
          first_user=$(id -u)
          output=$(mktemp)
          cd /
          sudo -u torlek-second env -i HOME=/home/torlek-second PATH=/usr/local/bin:/usr/bin:/bin \
            COCKPIT_CANDIDATE_ROOT="$root" COCKPIT_FIRST_USER_UID="$first_user" \
            "$root/sandbox-test" --include-ignored | tee "$output"
          grep -q '^test a_second_unix_user_starts_a_sandboxed_session \.\.\. ok$' "$output"
      - name: "Probe the native sandbox live: denied paths, an unknown and an allowed host, four launches (#433)"
        # Ignored in the gate because it reaches the internet; retried so a network blip is
        # reported flaky, not failed. The evidence each launch recorded prints in this log.
        env:
          COCKPIT_PREBUILT_PROGRAMS: "1"
        run: >-
          cargo nextest run
          --cargo-metadata target/nextest/cargo-metadata.json
          --binaries-metadata target/nextest/binaries-metadata.json
          --workspace-remap "$PWD" --target-dir-remap "$PWD/target"
          -E 'binary_id(=cockpit-daemon::live_enforcement)'
          --run-ignored only --no-capture --retries 2

  # The required check: it passes only when the lint job, the build job, every test shard and
  # the sandbox job passed, or when the change needs no greenfield job at all. Without `!cancelled()` a failed
  # shard would skip this job, and a skipped required check counts as passed.
  greenfield:
    needs: [changes, greenfield-lint, greenfield-build, greenfield-test, greenfield-sandbox]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require the lint, build, every test shard and the sandbox job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.greenfield }}
          LINT: ${{ needs.greenfield-lint.result }}
          BUILD: ${{ needs.greenfield-build.result }}
          TESTS: ${{ needs.greenfield-test.result }}
          SANDBOX: ${{ needs.greenfield-sandbox.result }}
        run: |
          echo "changes: $CHANGES, selected: $SELECTED, lint: $LINT, build: $BUILD, tests: $TESTS, sandbox: $SANDBOX"
          test "$CHANGES" = success
          if [ "$SELECTED" != true ]; then
            test "$SELECTED" = false
            exit 0
          fi
          test "$LINT" = success
          test "$BUILD" = success
          test "$TESTS" = success
          test "$SANDBOX" = success

  # The daemon's startup tests inside WSL 2: the M0 gate's WSL2 proof (#27). Why each step
  # exists: docs/decisions/2026-10-31-27-wsl2-proven-in-ci.md. cargo-nextest's pin and hash
  # match tools/tests/fixtures/ci-install-action-linux.json (test_ci_bootstrap.py). No build
  # cache, on purpose: docs/decisions/2026-11-01-397-ci-cost.md. Pull requests run
  # it only when a crate it builds changes (tools/ci-jobs.py); main always does (#397).
  greenfield-wsl2:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.platform == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        # setup-wsl's wrapper runs `bash --noprofile --norc -euo pipefail`.
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          # 26.04 packages tmux 3.6, the oldest sessions run on (#523); 24.04 has 3.4 (#433).
          distribution: Ubuntu-26.04
          wsl-version: 2
          wsl-shell-user: cockpit
          additional-packages: build-essential bubblewrap ca-certificates curl git tmux
      - name: Refuse to run anywhere but WSL 2, as root
        run: |
          uname -r
          case "$(uname -r)" in *microsoft-standard-WSL2*) ;; *) exit 1 ;; esac
          test "$(id -u)" -ne 0
      - name: Install rustup 1.29.2 and cargo-nextest 0.9.150, checksums verified
        run: |
          cd "$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSLo rustup-init \
            https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
          curl --proto '=https' --tlsv1.2 -fsSLo nextest.tar.gz \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz
          sha256sum --check --strict - <<'SUMS'
          5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4  rustup-init
          b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  nextest.tar.gz
          SUMS
          chmod +x rustup-init
          # rust-toolchain.toml picks the toolchain once the build runs in the clone.
          ./rustup-init -y --profile minimal --default-toolchain none
          tar -xzf nextest.tar.gz -C "$HOME/.cargo/bin"
      - name: Clone the checkout into the distribution's file system
        run: |
          # DrvFs files are not owned by the job's user; upload-pack checks the .git path.
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/.git"
          git clone --quiet "$PWD" "$HOME/agent-cockpit"
      - name: Start the daemon on a clean home
        run: |
          . "$HOME/.cargo/env"
          cd "$HOME/agent-cockpit"
          cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-daemon --test startup
      # The resource backend inside WSL 2 (#42): probed like Linux, reporting what it finds.
      - name: Admit resources
        run: |
          . "$HOME/.cargo/env"
          cd "$HOME/agent-cockpit"
          cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-resource-admission
      # The native sandbox inside WSL 2 (#433): the daemon's fixture probes, then the live
      # ones, which reach the internet and print the evidence each launch recorded. The
      # daemon's tests run the workspace's programs, built first.
      - name: Enforce the native sandbox
        run: |
          . "$HOME/.cargo/env"
          cd "$HOME/agent-cockpit"
          tmux -V
          bwrap --version
          cargo build --locked --manifest-path Cargo.toml --workspace --bins
          cargo nextest run --locked --manifest-path Cargo.toml --workspace --test sandbox
          cargo nextest run --locked --manifest-path Cargo.toml --workspace \
            --test live_enforcement --run-ignored only --no-capture --retries 2

  # Markdown and spelling, for docs/ and any Markdown file.
  docs:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: typos@1.51.1
      # lychee's release binary, checksum verified: compiling it took about 3.4 minutes (#397).
      - name: Install the pinned Markdown and link checkers
        run: |
          npm ci --prefix tools/docs-lint --ignore-scripts --no-audit --no-fund --include=dev
          echo "$GITHUB_WORKSPACE/tools/docs-lint/node_modules/.bin" >> "$GITHUB_PATH"
          cd "$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSLo lychee.tar.gz \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          sha256sum --check --strict - <<'SUMS'
          1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz
          SUMS
          tar -xzf lychee.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the docs gate
        run: make docs-ci
