name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.0
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential pkg-config libgtk-4-dev libgtk4-layer-shell-dev \
            libssl-dev python3-venv fish lua5.4 jq tmux socat stow sqlite3
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: >-
            cargo-nextest@0.9.150
            cargo-deny@0.20.2
            typos@1.51.1
            shellcheck@0.11.0
            shfmt@3.14.1
            biome@2.6.3
      - name: Install remaining pinned checkers
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-tools"
          "$RUNNER_TEMP/lint-tools/bin/pip" install ruff==0.17.3
          echo "$RUNNER_TEMP/lint-tools/bin" >> "$GITHUB_PATH"
          npm install --global markdownlint-cli2@0.24.0
          cargo install --locked --version 0.24.2 lychee
      - name: Run the same gate as local development
        run: make ci
