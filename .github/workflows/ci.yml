name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which jobs this change needs (tools/ci-jobs.py); a push to main runs every job once.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      greenfield: ${{ steps.select.outputs.greenfield }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the jobs this change needs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...HEAD" | python3 tools/ci-jobs.py >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci-jobs.py --all >> "$GITHUB_OUTPUT"
          fi

  # The root workspace in crates/.
  greenfield:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2,typos@1.51.1
      - name: Install tmux for cockpit-tmux's real-server tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        # Disposable hosted runners have no workstation game-guard daemon.
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Run the greenfield gate
        run: make greenfield-ci

  # The daemon's startup tests on macOS, clean-home start included (M0 gate, #27); the full
  # greenfield gate stays on Linux. Plain cargo: the Makefile's agent-build runner is Linux-only.
  greenfield-macos:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      # Why main saves and pull requests only restore:
      # docs/decisions/2026-10-31-127-platform-build-cache.md.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Start the daemon on a clean home
        run: cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-daemon --test startup
      # The process supervisor's macOS paths: ps start tokens, the boot session id and
      # process-group containment.
      - name: Supervise processes
        run: cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-processes

  # The daemon's startup tests inside WSL 2: the M0 gate's WSL2 proof (#27). Why each step
  # exists: docs/decisions/2026-10-31-27-wsl2-proven-in-ci.md. cargo-nextest's pin and hash
  # match tools/tests/fixtures/ci-install-action-linux.json (test_ci_bootstrap.py). No build
  # cache, on purpose: docs/decisions/2026-10-31-127-platform-build-cache.md.
  greenfield-wsl2:
    needs: changes
    if: needs.changes.outputs.greenfield == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        # setup-wsl's wrapper runs `bash --noprofile --norc -euo pipefail`.
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: cockpit
          additional-packages: build-essential ca-certificates curl git
      - name: Refuse to run anywhere but WSL 2, as root
        run: |
          uname -r
          case "$(uname -r)" in *microsoft-standard-WSL2*) ;; *) exit 1 ;; esac
          test "$(id -u)" -ne 0
      - name: Install rustup 1.29.2 and cargo-nextest 0.9.150, checksums verified
        run: |
          cd "$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSLo rustup-init \
            https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-unknown-linux-gnu/rustup-init
          curl --proto '=https' --tlsv1.2 -fsSLo nextest.tar.gz \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz
          sha256sum --check --strict - <<'SUMS'
          5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4  rustup-init
          b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f  nextest.tar.gz
          SUMS
          chmod +x rustup-init
          # rust-toolchain.toml picks the toolchain once the build runs in the clone.
          ./rustup-init -y --profile minimal --default-toolchain none
          tar -xzf nextest.tar.gz -C "$HOME/.cargo/bin"
      - name: Clone the checkout into the distribution's file system
        run: |
          # DrvFs files are not owned by the job's user; upload-pack checks the .git path.
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/.git"
          git clone --quiet "$PWD" "$HOME/agent-cockpit"
      - name: Start the daemon on a clean home
        run: |
          . "$HOME/.cargo/env"
          cd "$HOME/agent-cockpit"
          cargo nextest run --locked --manifest-path Cargo.toml -p cockpit-daemon --test startup

  # Markdown and spelling, for docs/ and any Markdown file.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.0
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: typos@1.51.1
      - name: Install the pinned Markdown and link checkers
        run: |
          npm install --global markdownlint-cli2@0.24.0
          cargo install --locked --version 0.24.2 lychee
      - name: Run the docs gate
        run: make docs-ci
