name: Release proposal

# Version/changelog drafts only. The local generator never receives the App token.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-plz.yml
      - release-plz.toml
      - cliff.toml
      - tools/changelog.py
      - tools/release_pr.py
      - tools/release.py
      - tools/tests/test_release.py
      - tools/tests/test_release_pr.py
      - tools/tests/release_pr_conformance.py
      - Makefile
      - .github/workflows/prerelease.yml
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate locally without pushing or changing pull requests
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

concurrency:
  group: release-proposal-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: release-plz@0.4.2,git-cliff@2.14.2
      - run: make release-pr-check
      - run: make release-pr-conformance

  proposal:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: release-proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      # For the dispatch-preconditions status; every step's github.token has it.
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          fallback: none
          tool: release-plz@0.4.2,git-cliff@2.14.2
      - name: Fetch locked dependencies for offline version calculation
        run: cargo fetch --locked
      - name: Read the proposal channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        # The same two lines as prerelease.yml reads.
        run: |
          alpha=$(gh issue view 52 --repo "$GITHUB_REPOSITORY" --json state --jq '.state | ascii_downcase')
          beta=$(gh issue view 57 --repo "$GITHUB_REPOSITORY" --json state --jq '.state | ascii_downcase')
          echo "alpha=$alpha" | tee -a "$GITHUB_OUTPUT"
          echo "beta=$beta" | tee -a "$GITHUB_OUTPUT"
          case "$beta" in
            open) echo "value=alpha" >> "$GITHUB_OUTPUT" ;;
            closed) echo "value=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown Beta 1 checklist state"; exit 1 ;;
          esac
      - name: Prepare files and a local proposal commit
        env:
          BASE: ${{ github.sha }}
          CHANNEL: ${{ steps.channel.outputs.value }}
        run: python3 tools/release_pr.py prepare --base "$BASE" --channel "$CHANNEL"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name == 'push' || !inputs.dry_run
        id: app
        with:
          client-id: ${{ vars.PROPOSAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROPOSAL_APP_PRIVATE_KEY }}
          owner: Androlax2
          repositories: agent-cockpit
          permission-contents: read
          permission-pull-requests: write
      - name: Create or reuse the immutable draft and supersede verified older drafts
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROPOSAL_GIT_SSH_KEY: ${{ secrets.PROPOSAL_GIT_SSH_KEY }}
          BASE: ${{ github.sha }}
        run: python3 tools/release_pr.py publish --base "$BASE"
      # After publish, so the draft it replaced is already closed. A refusal turns only the
      # status red, not this run: the draft was published correctly. The red status names the
      # refusal; the run's log has it in full. The dispatch still checks again (#1260).
      - name: Check the dispatch's preconditions on the published draft
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.sha }}
          ALPHA_CHECKLIST: ${{ steps.channel.outputs.alpha }}
          BETA_CHECKLIST: ${{ steps.channel.outputs.beta }}
        run: |
          draft_head=$(git rev-parse HEAD)
          git checkout --quiet --detach "$BASE"
          refusal_file="$RUNNER_TEMP/dispatch-refusal"
          # The same command as both prerelease.yml jobs run.
          if python3 tools/release.py next-prerelease --main origin/main \
            --alpha-checklist "$ALPHA_CHECKLIST" --beta-checklist "$BETA_CHECKLIST" \
            --open-issues-of "$GITHUB_REPOSITORY" 2>"$refusal_file"; then
            state=success
            description="The prerelease dispatch's checks pass on this draft"
          else
            cat "$refusal_file" >&2
            state=failure
            refusal=$(grep -m 1 '^release: ' "$refusal_file" || echo "release: unexpected error")
            description=$(printf '%s' "$refusal" | cut -c 1-140)
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$draft_head" \
            -f state="$state" \
            -f context="dispatch preconditions" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
