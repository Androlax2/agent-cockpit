name: Release

# A release tag (docs/RELEASING.md) builds every archive, attests them, drafts the GitHub
# Release with every asset, runs report 13's gate on the tagged commit, and publishes last.
# The nightly schedule and a manual dispatch (the build before a tag) run the same build and
# install checks as a dry run: no tag, attestation, draft or release. Pull requests start it
# only when they change the release machinery itself; ci.yml builds and tests crate changes.
# Tool choices: docs/decisions/2026-10-31-96-release-tooling.md; nightlies:
# docs/decisions/2026-10-31-96-nightly-builds.md.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/prerelease.yml
      - tools/release.py
      - tools/tests/test_release.py
      - tools/tests/test_release_plan.py
      - cliff.toml
      - tools/changelog.py
      - Makefile
      - tools/release_upgrade.py
      - tools/tests/test_release_upgrade.py
      - crates/cockpit-daemon/tests/candidate/mod.rs
      - crates/cockpit-daemon/tests/common/mod.rs
      - crates/cockpit-daemon/tests/real_daemon/mod.rs
      - crates/cockpit-daemon/tests/latency.rs
      - crates/cockpit-daemon/tests/latency/termination_evidence.rs
      - crates/cockpit-daemon/tests/protocol.rs
      - crates/cockpit-daemon/tests/restart_reattach.rs
      - crates/cockpit-daemon/tests/session_restore_crash.rs
      - crates/cockpit-turso/tests/migrations.rs
      - packaging/aur/ci-install.sh
      - packaging/aur/render.py
      - packaging/aur/torlek-bin/PKGBUILD.in
      - tools/tests/test_aur_package.py
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly from main: a dry run whose archives stay as workflow artifacts (#179).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # plan reads the gate issues' state.
  issues: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

defaults:
  run:
    # pipefail: `release.py ... | tee` must fail the step when release.py refuses.
    shell: bash

jobs:
  # The tag's version and channel, checked against every rule on the tagged commit.
  plan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      revision: ${{ steps.version.outputs.revision }}
      notes_range: ${{ steps.version.outputs.notes_range }}
      notes_tag: ${{ steps.version.outputs.notes_tag }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      build_matrix: ${{ steps.platforms.outputs.build_matrix }}
      install_matrix: ${{ steps.platforms.outputs.install_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the release tool
        run: make release-check
      - name: Check the tag, or name the dry run's version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        # Only a tag push releases; a dispatch or schedule on a tag ref is a dry run like any
        # other, and the tag-only jobs follow the `tag` output, which a dry run leaves empty.
        run: |
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            # The same checklists prerelease.yml reads: a hand-made tag meets every rule too.
            alpha=$(gh issue view 52 --repo "$GITHUB_REPOSITORY" --json state --jq '.state | ascii_downcase')
            beta=$(gh issue view 57 --repo "$GITHUB_REPOSITORY" --json state --jq '.state | ascii_downcase')
            python3 tools/release.py check-tag "$TAG" --main origin/main \
              --alpha-checklist "$alpha" --beta-checklist "$beta" | tee -a "$GITHUB_OUTPUT"
          else
            python3 tools/release.py dry-run-version | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Select the reviewed release platform scope
        id: platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: python3 tools/release.py release-plan --version "$VERSION" --channel "$CHANNEL" | tee -a "$GITHUB_OUTPUT"
  # git-cliff's notes over the range release.py chose; only the draft waits for them.
  notes:
    needs: plan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: git-cliff@2.14.2
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          NOTES_RANGE: ${{ needs.plan.outputs.notes_range }}
          NOTES_TAG: ${{ needs.plan.outputs.notes_tag }}
        run: |
          flags=()
          if [ -n "$NOTES_TAG" ]; then flags+=(--tag "$NOTES_TAG"); fi
          git cliff --config cliff.toml --strip all "${flags[@]}" "$NOTES_RANGE" > notes.md
          # Alpha notes carry the known gaps, headed by this release (#886). A tag's file can no
          # longer change, so prerelease.yml refuses a closed gap before the tag; the nightly
          # and a dispatch rehearse that, and a pull request never waits on another issue's state.
          if [ "$CHANNEL" = alpha ] || [ "$CHANNEL" = dev ]; then
            issues=(--open-issues-of "$GITHUB_REPOSITORY")
            if [ "$CHANNEL" = alpha ]; then issues=(); fi
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then issues=(); fi
            echo >> notes.md
            python3 tools/release.py known-gaps --version "$VERSION" "${issues[@]}" >> notes.md
          fi
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  # One archive per platform: the stamped version, built from the checked commit.
  build:
    needs: plan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.targets }}
      - name: Stamp the release version, uncommitted
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 tools/release.py stamp "$VERSION"
          # Rewrites only the workspace members' entries; --locked below refuses any other.
          cargo update --workspace
      - name: Build torlek, torlek-daemon, torlek-tui and the provider bridges
        env:
          TORLEK_SOURCE_REVISION: ${{ needs.plan.outputs.revision }}
          TARGETS: ${{ matrix.targets }}
        run: |
          target_flags=()
          for target in ${TARGETS//,/ }; do target_flags+=(--target "$target"); done
          cargo build --release --locked "${target_flags[@]}" -p cockpit-cli -p cockpit-daemon -p cockpit-tui -p cockpit-claude -p cockpit-codex -p cockpit-opencode
      - name: Gather the binaries
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir binaries
          for binary in torlek torlek-daemon torlek-tui torlek-claude-hook torlek-codex-hook torlek-codex-session torlek-opencode-bridge; do
            if [ "$RUNNER_OS" = macOS ]; then
              lipo -create -output "binaries/$binary" \
                "target/aarch64-apple-darwin/release/$binary" \
                "target/x86_64-apple-darwin/release/$binary"
              lipo "binaries/$binary" -verify_arch arm64 x86_64
            else
              cp "target/$TARGETS/release/$binary" "binaries/$binary"
            fi
          done
      - name: Package the bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          REVISION: ${{ needs.plan.outputs.revision }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir dist
          python3 tools/release.py package --version "$VERSION" --channel "$CHANNEL" \
            --platform "$PLATFORM" --revision "$REVISION" --binaries binaries --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Report 13's clean install: unpack into a fresh prefix, check every file against the
  # manifest, `torlek version --all`, and the daemon's start on an empty home.
  install:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.install_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dist
      - name: Install on a clean prefix and check it
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          if [ "$NATIVE_RUNNER" = macos-26-intel ]; then test "$(uname -m)" = x86_64; fi
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          python3 tools/release.py verify-install "$prefix"/torlek-v* --revision "$REVISION"

  # The torlek-bin AUR recipe on a clean Arch container, from the x86_64 archive and the
  # checksums (#562, docs/packaging/aur.md). Not in publish's needs: the AUR route does not
  # gate the tag (docs/decisions/2026-11-03-562-arch-packaging-alpha1.md); the AUR checklist
  # requires this job's success for the release it submits.
  install-arch:
    needs: [plan, assemble]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Pinned like the actions; pacman -Syu still brings it to the current Arch.
      image: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Build, install, verify and remove torlek-bin
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          REVISION: ${{ needs.plan.outputs.revision }}
        run: bash packaging/aur/ci-install.sh dist "$VERSION" "$CHANNEL" "$REVISION"

  # WSL2 has no archive of its own: it installs the Linux x86_64 one (report 13). Setup as in
  # ci.yml's greenfield-wsl2 job (docs/decisions/2026-10-31-27-wsl2-proven-in-ci.md).
  install-wsl2:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x86_64
          path: dist
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: cockpit
          additional-packages: ca-certificates python3
      - name: Install on a clean prefix inside WSL 2 and check it
        # A Windows step variable reaches WSL only through WSLENV; the revision is release.py's
        # `git rev-parse` output, 40 hex characters, so it is safe inline.
        run: |
          revision='${{ needs.plan.outputs.revision }}'
          case "$(uname -r)" in *microsoft-standard-WSL2*) ;; *) exit 1 ;; esac
          test "$(id -u)" -ne 0
          # The distribution's own file system, not DrvFs, as a real install would be.
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          python3 tools/release.py verify-install "$prefix"/torlek-v* --revision "$revision"

  # Protocol skew/restart use the archive; migration/crash fixtures use its source revision.
  compatibility:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x86_64
          path: dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      - name: Install tmux for isolated recovery fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux
          tmux -V
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Verify the unpacked candidate and run compatibility fixtures
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          COCKPIT_CANDIDATE_REVISION: ${{ needs.plan.outputs.revision }}
          COCKPIT_COMPATIBILITY_REPORT: ${{ github.workspace }}/candidate-compatibility.md
        run: |
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          roots=("$prefix"/torlek-v*)
          export COCKPIT_CANDIDATE_ROOT="${roots[0]}"
          python3 tools/release.py verify-install "$COCKPIT_CANDIDATE_ROOT" --revision "$REVISION"
          make release-compatibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-compatibility
          path: candidate-compatibility.md
          if-no-files-found: warn

  # A fixed five-minute run, at most two build stand-ins, against the same archive.
  responsiveness:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x86_64
          path: dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150
      - name: Install tmux for the isolated responsiveness fixture
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux
          tmux -V
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Measure the verified candidate and enforce the targets
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          COCKPIT_LATENCY_REPORT: ${{ github.workspace }}/candidate-responsiveness.md
        run: |
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          roots=("$prefix"/torlek-v*)
          export COCKPIT_CANDIDATE_ROOT="${roots[0]}"
          export COCKPIT_CANDIDATE_REVISION="$REVISION"
          python3 tools/release.py verify-install "$COCKPIT_CANDIDATE_ROOT" --revision "$REVISION"
          make release-responsiveness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-responsiveness
          path: candidate-responsiveness.md
          if-no-files-found: warn

  # Baseline assets are fetched with read-only credentials, outside any tested daemon.
  upgrade-baseline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the earlier published channel release, or record the exemption
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          platforms=$(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["PLATFORMS"])))')
          for platform in $platforms; do
            PLATFORM="$platform" BASELINE_DOWNLOADS="baseline/$platform" make release-upgrade-fetch
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-baseline
          path: baseline
          if-no-files-found: error

  upgrade:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [plan, build, upgrade-baseline]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.install_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.platform }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-baseline
          path: baseline
      - name: Stop the old daemon, start the candidate, and verify retained state
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          BASELINE_DOWNLOADS: baseline/${{ matrix.platform }}
        run: |
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          roots=("$prefix"/torlek-v*)
          COCKPIT_CANDIDATE_ROOT="${roots[0]}" make release-upgrade

  upgrade-wsl2:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [plan, build, upgrade-baseline]
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-baseline
          path: baseline
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          wsl-shell-user: cockpit
          additional-packages: ca-certificates python3 make git
      - name: Verify the upgrade inside WSL 2 with isolated state on its own filesystem
        run: |
          export REVISION='${{ needs.plan.outputs.revision }}'
          case "$(uname -r)" in *microsoft-standard-WSL2*) ;; *) exit 1 ;; esac
          test "$(id -u)" -ne 0
          prefix=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$prefix"
          roots=("$prefix"/torlek-v*)
          export COCKPIT_CANDIDATE_ROOT="${roots[0]}"
          BASELINE_DOWNLOADS=baseline/linux-x86_64 make release-upgrade

  # Checksums over every archive; with the archive-* artifacts, the nightly's download.
  assemble:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # A tag only: build provenance over the checksummed archives, then the draft with every
  # asset. Dry runs never attest, so no unreleased build verifies as this repository's.
  draft:
    environment: release
    if: needs.plan.outputs.tag != ''
    needs: [plan, notes, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Draft the release with every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Cockpit $VERSION" --notes-file notes.md "${flags[@]}" dist/*

  # Report 13's Rust checks, Clippy, dependency and license checks, crate-graph rules and
  # tests, on the tagged commit itself. The same steps as ci.yml's greenfield job.
  gate:
    if: needs.plan.outputs.tag != ''
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          fallback: none
          tool: cargo-nextest@0.9.150,cargo-deny@0.20.2,typos@1.51.1
      - name: Install tmux for cockpit-tmux's real-server tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tmux
          tmux -V
      - name: Configure hosted runner admission
        if: runner.environment == 'github-hosted'
        run: python3 config/bin/.local/bin/cockpit-game-guard off
      - name: Run the greenfield gate
        run: make greenfield-ci

  # Publishing is the last step and needs every gate job; a gate check without a job is a
  # named gap that keeps the release a draft (tools/release.py GATE_CHECKS).
  publish:
    environment: release
    if: needs.plan.outputs.tag != ''
    needs: [plan, draft, gate, install, install-wsl2, compatibility, responsiveness, upgrade, upgrade-wsl2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable gate and successful prerequisite
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/release.py verify-gates --channel "$CHANNEL" --results "$NEEDS_JSON"
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          latest=true
          if [ "$PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
