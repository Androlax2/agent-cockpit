# The Agent Cockpit's Rust programs: one workspace, built with `make build` into apps/target/release.
[workspace]
members = ["cockpit", "osd"]
resolver = "3"

[profile.release]
strip = true

# Every clone builds into its own apps/target; full debug info made each one 6-20G. Line tables
# keep backtraces and panic locations readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
