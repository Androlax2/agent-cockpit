# Every program of the Agent Cockpit and the desktop that is not a shell script: one workspace,
# built with `make cockpit` into apps/target/release.
[workspace]
members = ["cockpit", "desktop", "vitals"]
resolver = "3"

[profile.release]
strip = true

# Every clone builds into its own apps/target; full debug info made each one 6-20G. Line tables
# keep backtraces and panic locations readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
