<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a1b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>Agent Cockpit</title>
<style>
  :root { color-scheme: dark; --bg: #1a1b26; --card: #24283b; --fg: #c0caf5; --dim: #979fbe; --red: #f7768e; --yellow: #e0af68;
          --green: #9ece6a; --blue: #7aa2f7; --cyan: #7dcfff; --line: #363c55; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  .app-header, main { width: min(100%, 760px); margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left), env(safe-area-inset-right)); }
  .app-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: 20px; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 0; font-weight: 650; text-wrap: balance; }
  .eyebrow { margin: 0; font-size: 12px; color: var(--dim); text-transform: uppercase; }
  .connection { margin: 6px 0 0; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #updated[data-state="offline"] { color: var(--yellow); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 24px 0 10px; overflow-wrap: anywhere; text-wrap: balance; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 3px solid var(--line); }
  .card.needs-you { border-left-color: var(--yellow); }
  .card.working { border-left-color: var(--blue); } .card.approval { border-left-color: var(--red); }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .project { font-weight: 600; min-width: 0; overflow-wrap: anywhere; } .state { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .task, .request, .why { display: block; color: var(--dim); font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; text-wrap: pretty; }
  .request { color: var(--red); }
  .card-project { display: block; color: var(--cyan); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  pre { background: #16161e; border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere;
        font: 13px/1.35 ui-monospace, monospace; margin: 8px 0; }
  .command { color: var(--fg); font-weight: 600; }
  .input-output { max-height: 45dvh; overflow-y: auto; color: var(--dim); }
  .question { color: var(--yellow); font-weight: 600; margin-top: 6px; overflow-wrap: anywhere; }
  #screen { min-height: 160px; max-height: 45dvh; overflow-y: auto; border: 1px solid var(--line); }
  .warning { color: var(--red); font-weight: 600; font-size: 14px; margin-top: 6px; }
  .buttons { display: flex; gap: 10px; margin-top: 14px; }
  button { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; font: inherit; font-weight: 600; background: #30364d; color: var(--fg); cursor: pointer; touch-action: manipulation; }
  button.run { background: var(--blue); color: #1a1b26; border-color: transparent; } button.armed { background: var(--yellow); color: #1a1b26; }
  .approval button.run { background: var(--green); }
  button.no { background: #30364d; }
  button:active { opacity: .8; }
  :is(button, a, input, textarea, select, summary):focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .session-card { display: block; width: 100%; text-align: left; font-weight: normal; }
  .session-card.needs-you { border: 1px solid var(--yellow); }
  .session-card.working, .session-card.quiet { border-left-color: var(--line); }
  .list-heading { display: flex; justify-content: space-between; align-items: center; }
  .need-pill { background: var(--yellow); color: #1a1b26; font-weight: 700; font-size: 14px; border-radius: 16px; padding: 4px 14px; font-variant-numeric: tabular-nums; }
  .group-heading { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
  .group-heading.needs-you { color: var(--yellow); }
  .now { align-items: baseline; }
  .glyph { flex: none; width: 1.2em; font-weight: 700; } .glyph.needs-you { color: var(--yellow); } .glyph.working { color: var(--blue); } .glyph.quiet { color: var(--green); }
  .doing { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quiet .doing { font-weight: normal; color: var(--dim); }
  .state.stale { color: var(--yellow); }
  .why-line { display: flex; min-width: 0; margin: 2px 0 0 1.2em; font-size: 15px; white-space: nowrap; }
  .card-project { flex: none; font-weight: 600; } .separator { flex: none; color: var(--dim); }
  .card-task { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .ask-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-top: 10px; padding: 8px 14px;
             border-radius: 8px; background: var(--yellow); color: #1a1b26; font-weight: 700; }
  .ask { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .ask-verb { flex: none; font-weight: 500; }
  .quiet-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--dim); padding: 8px 4px; }
  .show-quiet { flex: none; background: none; border: none; color: var(--blue); min-height: 44px; }
  .session-card.asleep { margin-bottom: 8px; } button.wake { display: block; width: 100%; margin-bottom: 12px; }
  .overview { color: var(--dim); font-size: 14px; margin: 0 0 12px; }
  .refresh { flex: none; font-size: 13px; min-width: 80px; }
  .field { display: block; margin-top: 16px; }
  .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 64px; border-radius: 8px; border: 1px solid #414868; background: #16161e; color: var(--fg);
              font: inherit; padding: 12px; margin: 0; resize: vertical; }
  .back { background: none; border: none; color: var(--blue); min-height: 44px; flex: 0 0 auto; padding: 0 8px 0 0; margin-bottom: 8px; text-align: left; }
  .note { color: var(--dim); font-size: 13px; margin-top: 10px; overflow-wrap: anywhere; }
  .note:empty { display: none; }
  .note[data-kind="error"] { color: var(--red); }
  .note[data-kind="success"] { color: var(--green); }
  .empty, .loading { color: var(--dim); font-size: 14px; padding: 18px 0; text-wrap: pretty; }
  input { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid #414868; background: #16161e; color: var(--fg);
           font: inherit; padding: 12px; margin: 0; }
  nav { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; gap: 4px; width: min(100%, 760px); margin-inline: auto; padding: 8px max(8px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
         background: #16161e; border-top: 1px solid var(--line); }
  .tab { background: none; color: var(--dim); font-size: 12px; min-height: 48px; padding: 8px 4px; border-color: transparent; flex-basis: 0; }
  .tab.active { color: var(--blue); background: var(--card); }
  select { width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid #414868; background: #16161e; color: var(--fg); font: inherit; padding: 0 8px; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 14px; margin-top: 16px; min-height: 44px; }
  input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--blue); }
  details > summary { cursor: pointer; min-height: 44px; padding-block: 8px; }
  details > summary .row { display: inline-flex; width: calc(100% - 24px); }
  .phone-settings { margin-top: 24px; border-top: 1px solid var(--line); color: var(--dim); font-size: 14px; }
  .phone-settings > summary { padding-block: 16px; }
  .phone-settings h2 { display: none; }
  .terminal-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .terminal-heading h2 { margin: 0; }
  .terminal-heading button { min-height: 44px; background: none; border: none; padding: 6px 0; flex: none; font-size: 13px; color: var(--blue); }
  .outcome { color: var(--green); font-size: 14px; margin-top: 4px; }
  .notes { color: var(--fg); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; }
  .link { display: inline-block; color: var(--blue); margin-top: 8px; min-height: 32px; }
  .bar { height: 8px; border-radius: 4px; background: #16161e; margin-top: 8px; overflow: hidden; }
  .fill { height: 100%; }
  .code { font: 15px ui-monospace, monospace; overflow-wrap: anywhere; user-select: all; }
  button:focus-visible, summary:focus-visible, textarea:focus-visible, .conversation:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  button:disabled { opacity: .65; cursor: wait; }
  .session-card .task, .preview { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .preview { margin-top: 6px; font-size: 14px; color: var(--fg); overflow-wrap: anywhere; }
  #detail:not([hidden]) { position: fixed; z-index: 5; top: var(--viewport-top, 0px); left: 0; right: 0; width: min(100%, 760px); margin-inline: auto;
                          height: var(--mobile-height, 100dvh); display: flex; flex-direction: column; gap: 8px; background: var(--bg);
                          padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-left), env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)); }
  .chat-header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; align-items: center; flex-shrink: 0; }
  .chat-header .back { margin-bottom: 0; }
  .more { flex: none; min-height: 44px; padding: 6px 14px; font-size: 14px; }
  .chat-heading { font-size: 18px; color: var(--fg); text-transform: none; letter-spacing: normal; margin: 0; overflow-wrap: anywhere; }
  .chat-status { grid-column: 2; color: var(--dim); font-size: 13px; }
  .conversation-wrap { position: relative; flex: 1; min-height: 60px; display: flex; }
  .conversation { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 2px; }
  .chat-turn { margin: 0 0 16px; padding: 12px; background: var(--card); border-radius: 10px; }
  .chat-turn.from-you { margin-left: 24px; border-left: 3px solid var(--blue); }
  .chat-turn.from-agent { margin-right: 8px; }
  .speaker { font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
  .message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  .message-text.formatted { white-space: normal; }
  .formatted > :first-child { margin-top: 0; } .formatted > :last-child { margin-bottom: 0; }
  .formatted p { margin: 0 0 10px; white-space: pre-wrap; }
  .formatted .message-heading { font-weight: 650; margin-top: 14px; }
  .formatted ul, .formatted ol { margin: 0 0 10px; padding-left: 22px; }
  .formatted li { margin-bottom: 4px; }
  .formatted pre { white-space: pre; overflow-wrap: normal; margin: 0 0 10px; }
  .formatted code { font: 14px ui-monospace, monospace; background: #16161e; border-radius: 4px; padding: 1px 4px; overflow-wrap: anywhere; }
  .formatted strong { color: #fff; }
  .formatted .message-image { margin: 0 0 10px; }
  .formatted .message-image img { display: block; max-width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; }
  .formatted .message-image.expanded { overflow-x: auto; }
  .formatted .message-image.expanded img { max-width: none; cursor: zoom-out; }
  .formatted .message-image figcaption { margin-top: 4px; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  .formatted .message-image figcaption.image-missing { color: var(--red); }
  .jump-latest { position: absolute; right: 8px; bottom: 8px; flex: none; min-height: 40px; padding: 6px 14px; border-radius: 20px;
                 font-size: 14px; background: var(--blue); color: #1a1b26; border-color: transparent; box-shadow: 0 2px 10px #0008; }
  .chat-actions { max-height: 30dvh; overflow-y: auto; flex-shrink: 0; }
  .chat-actions:empty, #conversation-error:empty { display: none; }
  .chat-actions .card { margin-bottom: 0; }
  .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; background: var(--bg); flex-shrink: 0; }
  .reply-label { grid-column: 1 / -1; color: var(--dim); font-size: 13px; }
  .composer textarea { margin: 0; min-height: 54px; max-height: 35dvh; resize: none; overflow-y: auto; }
  .composer button { align-self: stretch; min-width: 72px; padding: 8px 14px; }
  .composer .note { grid-column: 1 / -1; margin: 0; }
  summary { min-height: 44px; padding: 10px 0; color: var(--blue); cursor: pointer; }
  .session-more { flex-shrink: 0; max-height: 50dvh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .session-more #screen { max-height: 35dvh; }
  #session-controls button { width: 100%; margin-bottom: 6px; }
  body:has(#detail:not([hidden])) :is(.app-header, nav) { display: none; }
  .tab { position: relative; }
  .badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--red); color: #1a1b26;
           font-size: 12px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 4px; scrollbar-width: none; }
  .chip { flex: none; min-height: 40px; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; background: var(--card); color: var(--dim); }
  .chip[aria-pressed="true"] { background: var(--blue); color: #1a1b26; border-color: transparent; }
  .chip-count { font-variant-numeric: tabular-nums; opacity: .8; }
  .composer-card h2 { margin-top: 0; }
  .composer-card .field:first-of-type { margin-top: 0; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); column-gap: 10px; }
  .todo-card { padding: 0 16px; }
  .todo-card > summary { display: block; list-style: none; padding: 14px 0; color: var(--fg); }
  .todo-card > summary::-webkit-details-marker { display: none; }
  .todo-title { display: block; font-weight: 600; overflow-wrap: anywhere; text-wrap: pretty; }
  .todo-card:not([open]) .todo-title { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .todo-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: #16161e; color: var(--dim); overflow-wrap: anywhere; }
  .tag.urgent { color: var(--yellow); } .tag.kind-bug { color: var(--red); } .tag.kind-feature { color: var(--green); }
  .tag.kind-improvement { color: var(--cyan); } .tag.kind-research { color: #bb9af7; }
  .todo-details { padding-bottom: 16px; border-top: 1px solid var(--line); }
  .todo-card.finished { opacity: .5; }
  @media (max-height: 500px) {
    #detail:not([hidden]) { gap: 4px; }
    .session-more { max-height: 40dvh; }
    .chat-actions { max-height: 20dvh; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div><p class="eyebrow">Cockpit</p><h1 id="view-title">Sessions</h1><p class="connection"><span id="updated" role="status">Connecting…</span></p></div>
  <button id="refresh-view" class="refresh" aria-label="Refresh view">Refresh</button>
</header>
<main>
<div id="approvals"></div>
<div id="starter"></div>
<div id="list"></div>
<div id="detail" hidden></div>
<details id="phone" class="phone-settings"><summary>Notifications &amp; pairing</summary><div id="phone-content"></div></details>
<div id="work" hidden></div>
<div id="pairing" hidden></div>
</main>
<nav id="tabs" aria-label="Cockpit sections"></nav>
<script src="/page.js"></script>
</body>
</html>
