[package]
name = "cockpit-core"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Cross-package UI fixtures only; production dependencies must not enable this.
test-support = []

[dependencies]
base64 = "0.22"
chrono = "0.4.45"
cockpit-protocol = { version = "0.1.0", path = "../cockpit-protocol" }
regex = "1.13.1"
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3.4.2"
libc = "0.2.191"
