# Loaded on top of kitty.conf by the Claude session manager window only (cockpit show).
# kitty encodes keys the legacy way unless an application asks for its own protocol, and tmux
# only asks for xterm's modifyOtherKeys, which kitty ignores: Ctrl+Tab then arrives as Tab and
# Ctrl+& as &. These maps send the modifyOtherKeys sequence themselves, which tmux reads as
# C-Tab, C-S-Tab and C-1 to C-3 for the root binds in tmux.conf. The fr layout's number row
# is & é " without Shift; Ctrl is the physical Command key (keyd swap).
map ctrl+tab send_text all \x1b[27;5;9~
map ctrl+shift+tab send_text all \x1b[27;6;9~
map ctrl+ampersand send_text all \x1b[27;5;49~
map ctrl+eacute send_text all \x1b[27;5;50~
map ctrl+quotedbl send_text all \x1b[27;5;51~
map ctrl+1 send_text all \x1b[27;5;49~
map ctrl+2 send_text all \x1b[27;5;50~
map ctrl+3 send_text all \x1b[27;5;51~
