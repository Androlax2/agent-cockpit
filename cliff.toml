# git-cliff: CHANGELOG.md and each release's notes from the squash subjects on main
# (docs/RELEASING.md, Changelog; docs/decisions/2026-10-31-96-release-tooling.md).

[changelog]
header = """
# Changelog

Release notes for Cockpit, newest first, generated by git-cliff from squash-merged PR
titles; do not edit by hand. [Releasing](docs/RELEASING.md) defines versions, channels and
the title format.
"""
# The `<!-- n -->` prefixes order the groups; striptags removes them from the heading.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Subjects from before the policy (#94) are not conventional; they stay, under "Other".
filter_unconventional = false
split_commits = false
filter_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->Continuous integration" },
  { message = "^chore", group = "<!-- 8 -->Chores" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
# The release tag shapes of docs/RELEASING.md and tools/release.py's TAG_PATTERN, nothing else.
tag_pattern = "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(alpha|beta)\\.[1-9][0-9]*)?$"
sort_commits = "oldest"
