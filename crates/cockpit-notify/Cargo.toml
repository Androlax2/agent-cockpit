[package]
name = "cockpit-notify"
description = "Desktop notifications and sounds when a session needs the owner: a client of the daemon's change feed, so the daemon stays headless."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "torlek-notify"
path = "src/main.rs"

[dependencies]
cockpit-client = { path = "../cockpit-client" }
cockpit-diagnostics = { path = "../cockpit-diagnostics" }
cockpit-protocol = { path = "../cockpit-protocol" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
