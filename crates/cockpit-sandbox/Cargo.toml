[package]
name = "cockpit-sandbox"
description = "Owns the sandbox every launched agent runs in: the profile Cockpit requests, the launch spec the native launcher enforces, the refusal on a host without it and the evidence of what each launch got."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["persistence"]
persistence = ["dep:cockpit-turso"]

[dependencies]
cockpit-config = { path = "../cockpit-config" }
cockpit-turso = { path = "../cockpit-turso", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
