[package]
name = "cockpit-sandbox"
description = "Owns the sandbox every launched agent runs in: the profile Cockpit requests, the platform capabilities that decide whether it can be enforced, the Greywall/greyproxy backend that enforces it and the evidence of what each launch got."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["persistence"]
persistence = ["dep:cockpit-turso"]

[dependencies]
cockpit-config = { path = "../cockpit-config" }
cockpit-turso = { path = "../cockpit-turso", optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
sha2 = "=0.10.9"
tempfile = "3.27.0"
serde_json = "1.0.154"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
