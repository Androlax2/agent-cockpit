[package]
name = "cockpit-verification"
description = "Owns what was checked: receipts that bind a check's exact definition, source, environment and artifacts to its outcome and bounded output, prose claims kept as unverified, and the outcome a gate of required checks has on an exact result."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cockpit-turso = { path = "../cockpit-turso" }
# The pin `cockpit-approvals` already carries (docs/decisions/2026-10-31-34-approvals-dependencies.md):
# artifact fingerprints (docs/decisions/2026-11-01-40-verification-receipts.md).
sha2 = "=0.10.9"
# The pin the other crates carry: artifacts are opened one segment at a time with
# `O_NOFOLLOW` (docs/decisions/2026-11-01-326-artifacts-never-follow-links.md).
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
