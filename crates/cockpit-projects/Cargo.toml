[package]
name = "cockpit-projects"
description = "Project identity, checkouts (parallel and review clones) with their incarnation, path validation, checkout occupancy and the safe host-Git rules they run under."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cockpit-turso = { path = "../cockpit-turso" }
# Existing workspace pin: descriptor-relative, no-follow storage measurements (#406).
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
