[package]
name = "cockpit-claude"
description = "The Claude Code provider adapter: its launch words, capabilities pinned to a tested version, terminal actions, screen-reading fallback and in-sandbox hook bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit-claude-hook"
path = "src/bin/cockpit-claude-hook.rs"

[dependencies]
# Versions keep cargo-deny's wildcard ban satisfied for these path dependencies.
cockpit-provider-api = { path = "../cockpit-provider-api", version = "0.1.0" }
serde_json = "1.0.154"
# The workspace-pinned process API stops sign-in probe descendants before reaping the leader.
rustix = { version = "=1.1.6", default-features = false, features = ["process", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
