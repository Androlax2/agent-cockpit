[package]
name = "cockpit-sessions"
description = "Agent sessions: provider conversations, message delivery and turn cancellation, and their lifecycle with the session and launch identities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cockpit-agent-channel = { path = "../cockpit-agent-channel" }
cockpit-authorization = { path = "../cockpit-authorization" }
cockpit-config = { path = "../cockpit-config" }
cockpit-processes = { path = "../cockpit-processes" }
cockpit-projects = { path = "../cockpit-projects" }
cockpit-provider-api = { path = "../cockpit-provider-api" }
cockpit-sandbox = { path = "../cockpit-sandbox" }
cockpit-tmux = { path = "../cockpit-tmux" }
cockpit-turso = { path = "../cockpit-turso" }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
