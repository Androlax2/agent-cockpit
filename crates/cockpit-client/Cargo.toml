[package]
name = "cockpit-client"
description = "The typed client every frontend and agent uses to talk to the daemon over its Unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cockpit-protocol = { path = "../cockpit-protocol" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[lints]
workspace = true
