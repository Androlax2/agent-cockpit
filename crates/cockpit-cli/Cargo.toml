[package]
name = "cockpit-cli"
description = "Owns the `cockpit` command line: it parses verbs and renders their results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
cockpit-client = { path = "../cockpit-client", version = "0.1.0" }
cockpit-config = { path = "../cockpit-config", version = "0.1.0" }
cockpit-protocol = { path = "../cockpit-protocol", version = "0.1.0" }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
