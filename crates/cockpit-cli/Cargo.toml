[package]
name = "cockpit-cli"
description = "Owns the `cockpit` command line: it parses verbs and renders their results."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
cockpit-config = { path = "../cockpit-config", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"

[lints]
workspace = true
