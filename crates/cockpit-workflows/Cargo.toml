[package]
name = "cockpit-workflows"
description = "Owns the next required step of a task and its progress: versioned presets with the provider capabilities and requirements each step declares, step state, checkpoints, handoffs, blockers, and the task packet rebuilt from durable records."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Versions keep cargo-deny's wildcard ban satisfied for these path dependencies.
cockpit-authorization = { path = "../cockpit-authorization", version = "0.1.0" }
cockpit-provider-api = { path = "../cockpit-provider-api", version = "0.1.0" }
cockpit-tasks = { path = "../cockpit-tasks", version = "0.1.0" }
cockpit-turso = { path = "../cockpit-turso", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
