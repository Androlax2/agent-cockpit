[package]
name = "cockpit-tui"
description = "The plain reference terminal UI: renders the daemon's state and sends the owner's commands through cockpit-client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit-tui"
path = "src/main.rs"

[dependencies]
cockpit-client = { path = "../cockpit-client", version = "0.1.0" }
cockpit-diagnostics = { path = "../cockpit-diagnostics", version = "0.1.0" }
cockpit-protocol = { path = "../cockpit-protocol", version = "0.1.0" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
