[package]
name = "cockpit-processes"
description = "Spawn, execution identity, stream draining, whole-tree termination and reattach of OS executions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# A version keeps cargo-deny's wildcard ban satisfied for this path dependency.
cockpit-turso = { path = "../cockpit-turso", version = "0.1.0" }
# Process-group signals and the empty-group probe without `unsafe` (docs/DECISIONS.md,
# 2026-10-31). Pinned: a signal or errno change must arrive as a reviewed bump.
rustix = { version = "=1.1.6", default-features = false, features = ["process", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
# The pseudo-terminal a terminal execution's test runs in; the same pinned version.
rustix = { version = "=1.1.6", default-features = false, features = ["process", "pty", "std"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
