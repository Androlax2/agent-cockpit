[package]
name = "cockpit-daemon"
description = "Startup, wiring, request routing and supervised worker lifetimes; no business rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit-daemon"
path = "src/main.rs"

[dependencies]
# Versions keep cargo-deny's wildcard ban satisfied for these path dependencies.
cockpit-agent-channel = { path = "../cockpit-agent-channel", version = "0.1.0" }
cockpit-approvals = { path = "../cockpit-approvals", version = "0.1.0" }
cockpit-authorization = { path = "../cockpit-authorization", version = "0.1.0" }
cockpit-claude = { path = "../cockpit-claude", version = "0.1.0" }
cockpit-config = { path = "../cockpit-config", version = "0.1.0" }
cockpit-diagnostics = { path = "../cockpit-diagnostics", version = "0.1.0" }
cockpit-messaging = { path = "../cockpit-messaging", version = "0.1.0" }
cockpit-processes = { path = "../cockpit-processes", version = "0.1.0" }
cockpit-projects = { path = "../cockpit-projects", version = "0.1.0" }
cockpit-protocol = { path = "../cockpit-protocol", version = "0.1.0" }
cockpit-provider-api = { path = "../cockpit-provider-api", version = "0.1.0" }
cockpit-resource-admission = { path = "../cockpit-resource-admission", version = "0.1.0" }
cockpit-sessions = { path = "../cockpit-sessions", version = "0.1.0" }
cockpit-tasks = { path = "../cockpit-tasks", version = "0.1.0" }
cockpit-tmux = { path = "../cockpit-tmux", version = "0.1.0" }
cockpit-turso = { path = "../cockpit-turso", version = "0.1.0" }
cockpit-verification = { path = "../cockpit-verification", version = "0.1.0" }
cockpit-workflows = { path = "../cockpit-workflows", version = "0.1.0" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
cockpit-client = { path = "../cockpit-client", version = "0.1.0" }
# The fake provider the session tests launch (#33).
cockpit-provider-api = { path = "../cockpit-provider-api", version = "0.1.0", features = ["fake"] }
tempfile = "3.27.0"

[lints]
workspace = true
