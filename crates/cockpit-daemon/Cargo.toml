[package]
name = "cockpit-daemon"
description = "Startup, wiring, request routing and supervised worker lifetimes; no business rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cockpit-daemon"
path = "src/main.rs"

[dependencies]
cockpit-agent-channel = { path = "../cockpit-agent-channel" }
cockpit-agent-context = { path = "../cockpit-agent-context" }
cockpit-approvals = { path = "../cockpit-approvals" }
cockpit-bug-reports = { path = "../cockpit-bug-reports" }
cockpit-authorization = { path = "../cockpit-authorization" }
cockpit-claude = { path = "../cockpit-claude" }
cockpit-codex = { path = "../cockpit-codex" }
cockpit-config = { path = "../cockpit-config" }
cockpit-diagnostics = { path = "../cockpit-diagnostics" }
cockpit-messaging = { path = "../cockpit-messaging" }
cockpit-opencode = { path = "../cockpit-opencode" }
cockpit-processes = { path = "../cockpit-processes" }
cockpit-projects = { path = "../cockpit-projects" }
cockpit-protocol = { path = "../cockpit-protocol" }
cockpit-provider-api = { path = "../cockpit-provider-api" }
cockpit-readiness = { path = "../cockpit-readiness" }
cockpit-resource-admission = { path = "../cockpit-resource-admission" }
cockpit-sandbox = { path = "../cockpit-sandbox" }
cockpit-scheduling = { path = "../cockpit-scheduling" }
cockpit-sessions = { path = "../cockpit-sessions" }
cockpit-tasks = { path = "../cockpit-tasks" }
cockpit-tmux = { path = "../cockpit-tmux" }
cockpit-turso = { path = "../cockpit-turso" }
cockpit-verification = { path = "../cockpit-verification" }
cockpit-workflows = { path = "../cockpit-workflows" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
cockpit-client = { path = "../cockpit-client" }
# The fake provider the session tests launch (#33).
cockpit-provider-api = { path = "../cockpit-provider-api", features = ["fake"] }
tempfile = "3.27.0"

[lints]
workspace = true
