[package]
name = "cockpit-containers"
description = "Owns the container engines Torlek uses: what an engine says it is, and the rootless Docker engine each project gets under a user of its own, verified before use."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["persistence"]
persistence = ["dep:cockpit-turso"]

[dependencies]
cockpit-turso = { path = "../cockpit-turso", optional = true }
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "net", "time"] }

[dev-dependencies]
cockpit-turso = { path = "../cockpit-turso" }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
