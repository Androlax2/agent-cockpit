[package]
name = "cockpit-agent-channel"
description = "Owns the one authenticated channel between sandboxed agents and the daemon: launch tokens, the verified process tree behind each sender and the per-project answers directories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Versions keep cargo-deny's wildcard ban satisfied for these path dependencies.
cockpit-authorization = { path = "../cockpit-authorization", version = "0.1.0" }
cockpit-turso = { path = "../cockpit-turso", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
