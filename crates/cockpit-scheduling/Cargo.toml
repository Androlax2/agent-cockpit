[package]
name = "cockpit-scheduling"
description = "Owns what runs where and why it waits: which waiting work is eligible, which session takes it, project-then-task fairness with aging, deterministic dispatch, and an explanation record per waiting item."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cockpit-authorization = { path = "../cockpit-authorization" }
cockpit-messaging = { path = "../cockpit-messaging" }
cockpit-provider-api = { path = "../cockpit-provider-api" }
cockpit-resource-admission = { path = "../cockpit-resource-admission" }
cockpit-tasks = { path = "../cockpit-tasks" }
cockpit-turso = { path = "../cockpit-turso" }
cockpit-workflows = { path = "../cockpit-workflows" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
