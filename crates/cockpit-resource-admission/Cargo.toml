[package]
name = "cockpit-resource-admission"
description = "Owns whether work fits the shared capacity budget: durable reservations, the limits requested, supported and enforced per execution, the foreground profile and the three pause operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Versions keep cargo-deny's wildcard ban satisfied for these path dependencies.
cockpit-processes = { path = "../cockpit-processes", version = "0.1.0" }
cockpit-turso = { path = "../cockpit-turso", version = "0.1.0" }
# The freeze of a process-group execution (SIGSTOP/SIGCONT) without `unsafe`; the same pin
# as cockpit-processes, so a signal change arrives as one reviewed bump.
rustix = { version = "=1.1.6", default-features = false, features = ["process", "std"] }
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
