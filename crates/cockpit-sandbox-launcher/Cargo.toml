[package]
name = "cockpit-sandbox-launcher"
description = "torlek-sandbox: starts one agent inside bubblewrap's namespaces, then applies Landlock and a seccomp filter from memory before running it (#829)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "torlek-sandbox"
path = "src/main.rs"

[dependencies]
cockpit-sandbox = { path = "../cockpit-sandbox", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned exactly (#546 D5): their unsafe code is reviewed upstream; this crate keeps
# `unsafe_code = "deny"`.
landlock = "=0.4.7"
seccompiler = "=0.5.0"
# Constants only (syscall numbers, ioctl requests); already in the tree through seccompiler.
libc = "0.2.191"
# Passing the proxy listener out of the sandbox's network namespace (SCM_RIGHTS, #831), and
# the engine masks' mounts and namespaces (#390, features added by Theo on 2026-11-13); the
# same exact pin as the workspace's other crates.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "mount", "net", "std", "thread"] }
# Selective TLS interception (#832), chosen by Theo on 2026-11-05 and pinned exactly like
# landlock: rustls on ring (no aws-lc), rcgen for the in-memory per-session CA, httparse for
# the intercepted HTTP/1.1 heads.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
httparse = { version = "=1.10.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
